[package]
name = "rainmill-discovery"
version = "0.1.0"
description = "robots.txt, sitemap.xml, llms.txt, humans.txt and security.txt for Laterite. One definition serves a database-backed site and a static build"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rainmill/discovery-plugin"

# Marks this crate as a Laterite plugin and names the module it registers, so a
# tool can tell what it is without building it. Which Laterite it supports is
# stated by the dependency requirement below, never repeated here.
[package.metadata.laterite]
plugin = "rainmill.discovery"
# Works in a static website: its files render at build time from YAML
# definitions under plugins/rainmill.discovery/.
static = true

[features]
# The admin module: settings screens, public routes, and the content sources
# other modules contribute. This is what an application installing the plugin
# wants.
default = ["admin"]
admin = ["dep:laterite-admin"]

[dependencies]
# The documents render from the framework's site envelope (`laterite_core::site`).
laterite-core = { version = "0.11" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
# The YAML definitions a static website keeps under plugins/rainmill.discovery/.
serde-saphyr = "1.3"

laterite-admin = { version = "0.11", optional = true }

[dev-dependencies]
laterite-core = { version = "0.11", features = ["testing", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
