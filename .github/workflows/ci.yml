name: CI

on:
  push:
    branches: [main]
  pull_request:

# The core half (the documents and their renderers) has no Laterite dependency,
# so it builds, lints and tests standalone. That is the architectural claim
# behind the feature split, and this job is what keeps it true: a dependency that
# crept into the core would fail here.
#
# The `admin` half builds, lints and tests against the framework's main branch,
# patched in over crates.io; the release workflow tests against the published
# crates.
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --no-default-features

  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch in the framework's main branch
        run: |
          git clone --depth 1 https://github.com/lateritecmf/laterite ../laterite
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          laterite-core = { path = "../laterite/crates/core" }
          laterite-admin = { path = "../laterite/crates/admin" }
          laterite-auth = { path = "../laterite/crates/auth" }
          laterite-macros = { path = "../laterite/crates/macros" }
          laterite-media = { path = "../laterite/crates/media" }
          laterite-web = { path = "../laterite/crates/web" }
          EOF
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
